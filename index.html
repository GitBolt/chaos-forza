<!DOCTYPE html>
<html lang="en">
	<head>
		<title>The Arena - Vehicular Combat</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #000;
				color: #fff;
			}

			a {
				color: #2983ff;
			}
			
			#debug-info {
				position: absolute;
				top: 60px;
				left: 20px;
				background-color: rgba(0, 0, 0, 0.7);
				padding: 5px 10px;
				border-radius: 5px;
				font-size: 12px;
				z-index: 100;
				display: none;
			}
			
			#toggle-mobile {
				position: absolute;
				top: 10px;
				right: 120px;
				background-color: rgba(0, 0, 0, 0.7);
				color: white;
				border: 1px solid #2983ff;
				padding: 5px 10px;
				border-radius: 5px;
				font-size: 12px;
				cursor: pointer;
				z-index: 100;
			}
		</style>
	</head>

	<body>

		<div id="container"></div>

		<!-- Game UI Elements -->
		<div id="game-ui">
			<!-- Game Title -->
			<div id="game-title">THE ARENA</div>
			
			<!-- Kill Counter -->
			<div id="kill-counter">
				<span id="kill-count">0</span> KILLS
			</div>
			
			<!-- Kill Notification -->
			<div id="kill-notification"></div>
			
			<!-- Controls Guide -->
			<div id="controls-guide">
				<div class="control-item">W,A,S,D - Drive</div>
				<div class="control-item">SPACE - Fire Rocket</div>
			</div>
			
			<!-- Mobile Controls -->
			<div id="mobile-controls">
				<div id="joystick-area">
					<div id="joystick"></div>
				</div>
				<div id="fire-button">FIRE</div>
			</div>
			
			<!-- Debug Info -->
			<div id="debug-info">Mobile Controls: <span id="debug-status">Initializing...</span></div>
			
			<!-- Toggle Mobile Controls Button (for testing) -->
			<button id="toggle-mobile">Toggle Mobile Controls</button>
		</div>

		<!-- Import maps polyfill -->
		<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.154.0/build/three.module.js",
					"three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/GLTFLoader.js",
					"three/addons/loaders/DRACOLoader.js": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/DRACOLoader.js",
					"three/addons/loaders/EXRLoader.js": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/EXRLoader.js"
				}
			}
		</script>

		<!-- Game scripts -->
		<script type="module" src="js/main.js"></script>
		
		<!-- Mobile Controls Toggle Script -->
		<script>
			document.addEventListener('DOMContentLoaded', function() {
				const toggleButton = document.getElementById('toggle-mobile');
				const mobileControls = document.getElementById('mobile-controls');
				const debugInfo = document.getElementById('debug-info');
				
				if (toggleButton && mobileControls) {
					toggleButton.addEventListener('click', function() {
						const isVisible = mobileControls.style.display === 'block';
						mobileControls.style.display = isVisible ? 'none' : 'block';
						debugInfo.style.display = isVisible ? 'none' : 'block';
						toggleButton.textContent = isVisible ? 'Show Mobile Controls' : 'Hide Mobile Controls';
					});
				}
			});
		</script>

	</body>
</html>
