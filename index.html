<!DOCTYPE html>
<html lang="en">
	<head>
		<title>The Arena - Vehicular Combat</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="preload" href="car.glb" as="fetch" crossorigin>
		<link rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #000;
				color: #fff;
			}

			a {
				color: #2983ff;
			}
			
			#debug-info {
				position: absolute;
				top: 60px;
				left: 20px;
				background-color: rgba(0, 0, 0, 0.7);
				padding: 5px 10px;
				border-radius: 5px;
				font-size: 12px;
				z-index: 100;
				display: none;
			}
			
			#toggle-mobile {
				position: absolute;
				top: 10px;
				right: 120px;
				background-color: rgba(0, 0, 0, 0.7);
				color: white;
				border: 1px solid #2983ff;
				padding: 5px 10px;
				border-radius: 5px;
				font-size: 12px;
				cursor: pointer;
				z-index: 100;
				display: none;
			}
			
			#quality-settings {
				position: absolute;
				top: 10px;
				right: 20px;
				background-color: rgba(0, 0, 0, 0.7);
				color: white;
				border: 1px solid #2983ff;
				padding: 5px 10px;
				border-radius: 5px;
				font-size: 12px;
				cursor: pointer;
				z-index: 100;
				display: none;
			}
			
			#quality-panel {
				position: absolute;
				top: 50px;
				right: 20px;
				background-color: rgba(0, 0, 0, 0.9);
				color: white;
				border: 1px solid #2983ff;
				padding: 15px;
				border-radius: 5px;
				font-size: 14px;
				z-index: 101;
				display: none;
				width: 200px;
			}
			
			#quality-panel h3 {
				margin-top: 0;
				margin-bottom: 10px;
				color: #2983ff;
				font-size: 16px;
				text-align: center;
			}
			
			.quality-option {
				margin: 10px 0;
			}
			
			.quality-option label {
				display: block;
				margin-bottom: 5px;
			}
			
			.quality-option select, .quality-option button {
				width: 100%;
				padding: 5px;
				background-color: #222;
				color: white;
				border: 1px solid #2983ff;
				border-radius: 3px;
			}
			
			.quality-option button {
				cursor: pointer;
				margin-top: 10px;
				background-color: #2983ff;
				color: black;
				font-weight: bold;
			}
			
			.quality-option button:hover {
				background-color: #1a6cd1;
			}
			
			#fps-counter {
				position: absolute;
				top: 10px;
				left: 20px;
				background-color: rgba(0, 0, 0, 0.7);
				padding: 5px 10px;
				border-radius: 5px;
				font-size: 12px;
				z-index: 100;
			}
			
			#game-title {
				position: absolute;
				top: 50px;
				left: 20px;
				font-size: 24px;
				font-weight: bold;
				color: #ffffff;
				text-shadow: 0 0 10px rgba(41, 131, 255, 0.9), 0 0 20px rgba(41, 131, 255, 0.7);
				letter-spacing: 2px;
				background-color: rgba(0, 0, 0, 0.6);
				padding: 8px 15px;
				border-radius: 5px;
				border-left: 4px solid #2983ff;
				box-shadow: 0 0 15px rgba(41, 131, 255, 0.5);
			}
			
			/* Loading Screen Styles */
			#loading-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #000;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				transition: opacity 0.18s ease-out;
			}
			
			#loading-screen.fade-out {
				opacity: 0;
				pointer-events: none;
			}
			
			#loading-logo {
				font-size: 48px;
				font-weight: bold;
				color: #ffffff;
				text-shadow: 0 0 20px rgba(41, 131, 255, 0.9), 0 0 40px rgba(41, 131, 255, 0.7);
				letter-spacing: 4px;
				margin-bottom: 30px;
			}
			
			#loading-bar-container {
				width: 300px;
				height: 20px;
				background-color: rgba(0, 0, 0, 0.5);
				border: 2px solid #2983ff;
				border-radius: 10px;
				overflow: hidden;
				box-shadow: 0 0 15px rgba(41, 131, 255, 0.5);
			}
			
			#loading-bar {
				width: 0%;
				height: 100%;
				background: linear-gradient(to right, #1a6cd1, #2983ff);
				transition: width 0.12s ease-out;
			}
			
			#loading-text {
				margin-top: 15px;
				font-size: 16px;
				color: #2983ff;
			}
		</style>
	</head>

	<body>
		<!-- Loading Screen -->
		<div id="loading-screen">
			<div id="loading-logo">THE ARENA</div>
			<div id="loading-bar-container">
				<div id="loading-bar"></div>
			</div>
			<div id="loading-text">Loading game assets...</div>
		</div>

		<div id="container"></div>

		<!-- Game UI Elements -->
		<div id="game-ui">
			<!-- Game Title -->
			<div id="game-title">THE ARENA</div>
			
			<!-- Kill Counter -->
			<div id="kill-counter">
				<span id="kill-count">0</span> KILLS
			</div>
			
			<!-- Kill Notification -->
			<div id="kill-notification"></div>
			
			<!-- Controls Guide -->
			<div id="controls-guide">
				<div class="control-item">W,A,S,D - Drive</div>
				<div class="control-item">SPACE - Fire Rocket</div>
			</div>
			
			<!-- Mobile Controls -->
			<div id="mobile-controls">
				<div id="joystick-area">
					<div id="joystick"></div>
				</div>
				<div id="fire-button">FIRE</div>
			</div>
			
			<!-- Debug Info -->
			<div id="debug-info">Mobile Controls: <span id="debug-status">Initializing...</span></div>
			
			<!-- Toggle Mobile Controls Button (hidden) -->
			<button id="toggle-mobile">Toggle Mobile Controls</button>
			
			<!-- FPS Counter -->
			<div id="fps-counter">FPS: <span id="fps">0</span></div>
			
			<!-- Quality Settings Button (hidden) -->
			<button id="quality-settings">Quality Settings</button>
		</div>

		<!-- Import maps polyfill -->
		<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.154.0/build/three.module.js",
					"three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/GLTFLoader.js",
					"three/addons/loaders/DRACOLoader.js": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/DRACOLoader.js",
					"three/addons/loaders/EXRLoader.js": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/EXRLoader.js"
				}
			}
		</script>

		<!-- Game scripts -->
		<script type="module" src="js/main.js"></script>
		
		<!-- Mobile Controls Script -->
		<script>
			document.addEventListener('DOMContentLoaded', function() {
				// Auto-detect mobile devices and show controls
				const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
				const mobileControls = document.getElementById('mobile-controls');
				
				if (isMobile && mobileControls) {
					mobileControls.style.display = 'block';
				}
				
				// FPS counter
				const fpsElement = document.getElementById('fps');
				let frameCount = 0;
				let lastTime = performance.now();
				
				function updateFPS() {
					frameCount++;
					const currentTime = performance.now();
					
					if (currentTime - lastTime >= 1000) {
						const fps = Math.round(frameCount * 1000 / (currentTime - lastTime));
						if (fpsElement) {
							fpsElement.textContent = fps;
							
							// Color code based on performance
							if (fps < 30) {
								fpsElement.style.color = '#ff4444';
							} else if (fps < 50) {
								fpsElement.style.color = '#ffaa44';
							} else {
								fpsElement.style.color = '#44ff44';
							}
						}
						
						frameCount = 0;
						lastTime = currentTime;
					}
					
					requestAnimationFrame(updateFPS);
				}
				
				// Start FPS counter
				updateFPS();
			});
		</script>

	</body>
</html>
